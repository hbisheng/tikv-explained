[book]
authors = ["Bisheng Huang"]
language = "en"
multilingual = false
src = "src"
title = "TiKV Explained: Mental Models from the Ground Up"

[build]
build-dir = "book"
create-missing = false

[output.html]
git-repository-url = "https://github.com/hbisheng/tikv-explained"
edit-url-template = "https://github.com/hbisheng/tikv-explained/edit/main/{path}"
site-url = "/tikv-explained/"
additional-css = ["theme/custom.css"]
additional-js = ["theme/chapter-title.js"]
no-section-label = true

[output.html.fold]
enable = true
level = 1

[output.html.print]
enable = true

[output.html.redirect]
"/tikv-101/index.html" = "../101.html"
